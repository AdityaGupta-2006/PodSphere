          scroll-behavior: smooth;
        }
        html, body {
          margin: 0;
          padding: 0;
          min-height: 100%;
        }
        body {
          overflow-y: auto;
        }

          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #131313;
      }
      ::-webkit-scrollbar-thumb {
        background: #353534;
        border-radius: 4px;
      }
